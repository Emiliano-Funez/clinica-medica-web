<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Outfit:wght@400;500;600&display=swap">
<title>Mi agenda · ClinicaMed</title>
<link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
<a class="saltar" href="#contenido">Saltar al contenido</a>
<header class="cabecera"></header>
<main id="contenido" class="contenedor panel">
<h1>Mi agenda</h1>
<div class="filtros" aria-label="Consultar agenda">
  <div class="campo"><label for="fecha-agenda">Ver turnos de una fecha</label><input id="fecha-agenda" type="date" required></div>
  <button id="ver-fecha" class="boton boton--primario" type="button">Ver fecha</button>
  <button id="ver-proximos" class="boton boton--secundario" type="button">Ver próximos turnos</button>
</div>
<p id="fecha-hoy" class="texto-suave" aria-live="polite"></p>
<div class="resumen">
  <button id="filtro-total" class="tarjeta resumen__filtro" type="button" aria-pressed="true"><strong id="total">0</strong> turnos</button>
  <button id="filtro-atendidos" class="tarjeta resumen__filtro" type="button" aria-pressed="false"><strong id="atendidos">0</strong> atendidos</button>
  <button id="filtro-pendientes" class="tarjeta resumen__filtro" type="button" aria-pressed="false"><strong id="pendientes">0</strong> pendientes</button>
</div>
<div class="tabla-envoltorio"><table id="tabla" class="tabla" hidden>
  <thead><tr><th scope="col">Fecha</th><th scope="col">Hora</th><th scope="col">Paciente</th><th scope="col">DNI</th><th scope="col">Estado</th><th scope="col">Acción</th></tr></thead>
  <tbody id="cuerpo"></tbody>
</table></div>
<p id="vacio" class="aviso aviso--info" hidden></p>
</main>
<footer class="pie"><p>ClinicaMed · Proyecto académico</p></footer>
<script type="module" src="../js/paginas/agenda.js"></script>
</body>
</html>
