<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Outfit:wght@400;500;600&display=swap">
<title>Alta de paciente · ClinicaMed</title>
<link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
<a class="saltar" href="#contenido">Saltar al contenido</a>
<header class="cabecera"></header>
<main id="contenido" class="contenedor panel">
<h1>Alta de paciente nuevo</h1>
<form id="form-paciente" class="tarjeta" novalidate>
  <div class="formulario-doble">
    <div class="campo"><label for="nombre">Nombre</label><input id="nombre" name="nombre" required></div>
    <div class="campo"><label for="apellido">Apellido</label><input id="apellido" name="apellido" required></div>
    <div class="campo"><label for="dni">DNI</label><input id="dni" name="dni" inputmode="numeric" pattern="\d{7,8}" title="7 u 8 números, sin puntos" required></div>
    <div class="campo"><label for="fechaNacimiento">Fecha de nacimiento</label><input id="fechaNacimiento" name="fechaNacimiento" type="date" required></div>
    <div class="campo"><label for="telefono">Teléfono</label><input id="telefono" name="telefono" type="tel" required></div>
    <div class="campo"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
  </div>
  <p id="aviso" role="alert" hidden></p>
  <button class="boton boton--primario" type="submit">Guardar paciente</button>
  <button id="guardar-turno" class="boton boton--secundario" type="submit">Guardar y cargar turno</button>
</form>
</main>
<footer class="pie"><p>ClinicaMed · Proyecto académico</p></footer>
<script type="module" src="../js/paginas/nuevo-paciente.js"></script>
</body>
</html>
