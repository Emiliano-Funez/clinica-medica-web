<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Outfit:wght@400;500;600&display=swap">
<title>Crear cuenta · ClinicaMed</title>
<link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
<a class="saltar" href="#contenido">Saltar al contenido</a>
<header class="cabecera"></header>
<main id="contenido" class="acceso">
  <section class="acceso__bienvenida">
    <h1>Creá tu cuenta</h1>
    <p>Pedimos solo lo necesario para reservar tus turnos.</p>
  </section>
  <section class="acceso__formulario">
    <h2>Registro de paciente</h2>
    <form id="form-registro" novalidate>
      <div class="acceso__doble">
        <div class="campo"><label for="nombre">Nombre</label><input id="nombre" name="nombre" autocomplete="given-name" required></div>
        <div class="campo"><label for="apellido">Apellido</label><input id="apellido" name="apellido" autocomplete="family-name" required></div>
        <div class="campo"><label for="dni">DNI</label><input id="dni" name="dni" inputmode="numeric" pattern="\d{7,8}" title="7 u 8 números, sin puntos" required></div>
        <div class="campo"><label for="fechaNacimiento">Fecha de nacimiento</label><input id="fechaNacimiento" name="fechaNacimiento" type="date" autocomplete="bday" required></div>
        <div class="campo"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="campo"><label for="telefono">Teléfono</label><input id="telefono" name="telefono" type="tel" autocomplete="tel" required></div>
        <div class="campo"><label for="clave">Contraseña</label><input id="clave" name="clave" type="password" minlength="8" autocomplete="new-password" required><small>Mínimo 8 caracteres.</small></div>
        <div class="campo"><label for="clave2">Repetir contraseña</label><input id="clave2" name="clave2" type="password" autocomplete="new-password" required></div>
      </div>
      <p id="aviso" role="alert" hidden></p>
      <button class="boton boton--primario" type="submit">Crear mi cuenta</button>
    </form>
    <p>¿Ya tenés cuenta? <a href="ingreso.html">Ingresá</a></p>
  </section>
</main>
<footer class="pie"><p>ClinicaMed · Proyecto académico</p></footer>
<script type="module" src="../js/paginas/registro.js"></script>
</body>
</html>
