<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Outfit:wght@400;500;600&display=swap">
<title>Iniciar sesión · ClinicaMed</title>
<link rel="stylesheet" href="../scss/pages/_ingreso.scss">
</head>
<body>
<a class="saltar" href="#contenido">Saltar al contenido</a>
<header class="cabecera"></header>
<main id="contenido" class="acceso">
  <section class="acceso__bienvenida">
    <h1>Bienvenido/a de nuevo</h1>
    <p>Ingresá para ver tus turnos y tu historial.</p>
  </section>
  <section class="acceso__formulario">
    <h2>Iniciar sesión</h2>
    <form id="form-ingreso" novalidate>
      <div class="campo"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="campo"><label for="clave">Contraseña</label><input id="clave" name="clave" type="password" autocomplete="current-password" required></div>
      <p id="aviso" role="alert" hidden></p>
      <button class="boton boton--primario" type="submit">Ingresar</button>
    </form>
    <p>¿No tenés cuenta? <a href="registro.html">Registrate</a></p>
    <p class="texto-suave"><small>Demo con datos ficticios: paciente@demo.test · Demo1234</small></p>
  </section>
</main>
<footer class="pie"><p>ClinicaMed · Proyecto académico · Todos los datos son ficticios</p></footer>
<script type="module" src="../js/paginas/ingreso.js"></script>
</body>
</html>
